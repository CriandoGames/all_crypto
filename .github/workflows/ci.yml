name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test
      - name: Test with coverage
        run: dart test --coverage=coverage

      - name: Generate API documentation with dartdoc 9.0.8
        run: |
          dart pub global activate dartdoc 9.0.8
          dart pub global run dartdoc

      - name: Verify publish manifest has no path dependency
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*path:' pubspec.yaml; then
            echo 'pubspec.yaml must not contain path dependencies'
            exit 1
          fi

      - name: Verify required documents
        shell: bash
        run: |
          for file in README.md README.en.md CHANGELOG.md SECURITY.md SECURITY.en.md CONTRIBUTING.md CONTRIBUTING.en.md LICENSE; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done

      - name: Validate publication archive
        run: dart pub publish --dry-run
